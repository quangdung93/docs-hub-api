# nginx site cho object storage — đặt tại /etc/nginx/sites-available/storage.docshub.io.vn
#
#   sudo cp deployments/ec2/nginx/storage.docshub.io.vn.conf \
#           /etc/nginx/sites-available/storage.docshub.io.vn
#   sudo ln -sf /etc/nginx/sites-available/storage.docshub.io.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d storage.docshub.io.vn --redirect
#
# Cần bản ghi DNS A: storage.docshub.io.vn -> IP của EC2, trước khi chạy certbot.
#
# Vì sao cần site này: presigned URL ký kèm hostname (SigV4). API ký URL theo
# host công khai (minio.public_endpoint), nên request từ trình duyệt phải tới
# đúng host đó rồi mới được proxy vào MinIO. MinIO vẫn chỉ bind 127.0.0.1:9000.
server {
    listen 80;
    listen [::]:80;

    server_name storage.docshub.io.vn;

    # BẮT BUỘC: chữ ký SigV4 tính trên Host header. Đổi Host ở đây là hỏng chữ ký.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # File tài liệu tối đa 50 MiB (document/usecase/service.go). Để 0 = không
    # giới hạn ở tầng nginx, giới hạn thật do API và MinIO quyết định.
    client_max_body_size 0;

    # Không đệm request/response: upload file lớn phải chảy thẳng, không nằm
    # trọn trong bộ nhớ hay đĩa tạm của nginx.
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;

    # Upload chậm không được coi là treo.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:9000;
    }
}
