# nginx site cho API — đặt tại /etc/nginx/sites-available/api.docshub.io.vn
# rồi symlink sang sites-enabled/.
#
# File này chỉ khai báo phần HTTP. TLS do certbot thêm vào:
#
#   sudo cp deployments/ec2/nginx/api.docshub.io.vn.conf \
#           /etc/nginx/sites-available/api.docshub.io.vn
#   sudo ln -sf /etc/nginx/sites-available/api.docshub.io.vn /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.docshub.io.vn --redirect
#
# Sau khi certbot chạy, file trong /etc/nginx sẽ có thêm block listen 443 +
# ssl_certificate + redirect 80->443. KHÔNG copy đè file này lên nữa nếu không
# muốn mất phần đó — sửa ở đây rồi chạy lại certbot.
server {
    listen 80;
    listen [::]:80;

    server_name api.docshub.io.vn;

    # API bind 127.0.0.1:8080 (xem deployments/ec2/docker-compose.yml) nên chỉ
    # nginx trên cùng máy gọi được — không ai vào thẳng cổng 8080 từ internet.
    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
