# Hạ tầng local cho docs-hub-api.
# Dùng: make up (bật) / make down (tắt).
# Mọi service đều có healthcheck để `depends_on: condition: service_healthy` hoạt động.
name: document-hub

services:
  postgres:
    # Ảnh pgvector/pgvector kèm sẵn extension vector cho RAG.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: document_hub
    ports:
      - "5433:5432" # tránh trùng PostgreSQL cài trực tiếp trên host
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d document_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app_password
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP gRPC (nếu không dùng collector riêng)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090" # UI (tránh trùng admin port 9090 của app)

  # Service chạy migration TRƯỚC khi api khởi động (bước riêng, không nằm trong main.go).
  migrate:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/app/migrate", "-config", "/app/configs/config.dev.yaml", "up"]
    environment:
      APP_ENV: dev
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-123456}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    # Chỉ truyền đối số — ENTRYPOINT đã là /app/api. Lặp lại binary ở đây khiến
    # flag.Parse() bỏ qua -config.
    command: ["-config", "/app/configs/config.dev.yaml"]
    environment:
      APP_ENV: dev
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-123456}
      APP_RABBITMQ_PASSWORD: app_password
      APP_MINIO_SECRET_KEY: minioadmin
      APP_JWT_SECRET: dev-secret-doi-o-that
      APP_RAGFLOW_ENABLED: ${APP_RAGFLOW_ENABLED:-false}
      APP_RAGFLOW_BASE_URL: ${APP_RAGFLOW_BASE_URL:-http://ragflow:9380}
      APP_RAGFLOW_API_KEY: ${APP_RAGFLOW_API_KEY:-}
      APP_RAGFLOW_DATASET_PREFIX: ${APP_RAGFLOW_DATASET_PREFIX:-docs_hub_local}
      APP_RAGFLOW_TIMEOUT: ${APP_RAGFLOW_TIMEOUT:-30s}
      APP_RAGFLOW_UPLOAD_TIMEOUT: ${APP_RAGFLOW_UPLOAD_TIMEOUT:-2m}
      APP_RAGFLOW_POLL_INTERVAL: ${APP_RAGFLOW_POLL_INTERVAL:-3s}
      APP_RAGFLOW_MAX_POLL_DURATION: ${APP_RAGFLOW_MAX_POLL_DURATION:-15m}
    ports:
      - "8080:8080" # API
      - "9090:9090" # admin (metrics/health/pprof)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    profiles: ["ragflow"]
    build:
      context: ../..
      dockerfile: deployments/docker/Dockerfile
    entrypoint: ["/app/worker", "-config", "/app/configs/config.dev.yaml"]
    environment:
      APP_ENV: dev
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-123456}
      APP_RABBITMQ_PASSWORD: app_password
      APP_MINIO_SECRET_KEY: minioadmin
      APP_JWT_SECRET: dev-secret-doi-o-that
      APP_RAGFLOW_ENABLED: ${APP_RAGFLOW_ENABLED:-false}
      APP_RAGFLOW_BASE_URL: ${APP_RAGFLOW_BASE_URL:-http://ragflow:9380}
      APP_RAGFLOW_API_KEY: ${APP_RAGFLOW_API_KEY:-}
      APP_RAGFLOW_DATASET_PREFIX: ${APP_RAGFLOW_DATASET_PREFIX:-docs_hub_local}
      APP_RAGFLOW_TIMEOUT: ${APP_RAGFLOW_TIMEOUT:-30s}
      APP_RAGFLOW_UPLOAD_TIMEOUT: ${APP_RAGFLOW_UPLOAD_TIMEOUT:-2m}
      APP_RAGFLOW_POLL_INTERVAL: ${APP_RAGFLOW_POLL_INTERVAL:-3s}
      APP_RAGFLOW_MAX_POLL_DURATION: ${APP_RAGFLOW_MAX_POLL_DURATION:-15m}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
