# Pipeline TỰ CHỨA — KHÔNG include isc/cicd-config (chưa có template go/).
# Khi ISC có template Go chính thức, cân nhắc chuyển sang include.
stages:
  - lint
  - test
  - build
  - docker

default:
  image: golang:1.25
  tags:
    - docker

variables:
  GOFLAGS: "-buildvcs=false"
  GOMODCACHE: "$CI_PROJECT_DIR/.cache/go-mod"
  DOCKER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

cache:
  key:
    files:
      - go.sum
  paths:
    - .cache/go-mod

# ------------------------------------------------------------------ lint
lint:
  stage: lint
  script:
    - test -z "$(gofmt -l .)" || (echo "❌ Code chưa gofmt"; gofmt -l .; exit 1)
    - go vet ./...
    - go run github.com/golangci/golangci-lint/cmd/golangci-lint@v1.61.0 run --timeout 5m

# ------------------------------------------------------------------ test unit
test:unit:
  stage: test
  script:
    - go test -race -short -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week

# ------------------------------------------------------------------ test integration
test:integration:
  stage: test
  services:
    - name: mysql:8.4
      alias: mysql
      command: ["--character-set-server=utf8mb4"]
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: document_hub
    TEST_MYSQL_DSN: "root:root@tcp(mysql:3306)/document_hub?charset=utf8mb4&parseTime=True&loc=UTC"
  script:
    # Chờ MySQL sẵn sàng rồi chạy test có build tag integration.
    - go test -tags=integration -race ./internal/module/user/repository/... ./test/integration/...

# ------------------------------------------------------------------ migrate check (up rồi down)
migrate:check:
  stage: test
  services:
    - name: mysql:8.4
      alias: mysql
  variables:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: document_hub
    # Override user/password của config.dev.yaml sang root cho tiện trong CI.
    APP_MYSQL_USER: root
    APP_MYSQL_PASSWORD: root
    APP_JWT_SECRET: ci-secret
  script:
    - go build -o bin/migrate ./cmd/migrate
    - ./bin/migrate -config configs/config.dev.yaml up
    - ./bin/migrate -config configs/config.dev.yaml down 1

# ------------------------------------------------------------------ build
build:
  stage: build
  script:
    - mkdir -p bin
    - go build -ldflags "-s -w -X main.version=$CI_COMMIT_SHORT_SHA" -o bin/api ./cmd/api
    - go build -o bin/migrate ./cmd/migrate
    - go build -o bin/seed ./cmd/seed
  artifacts:
    paths:
      - bin/
    expire_in: 1 week

# ------------------------------------------------------------------ docker
docker:build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -f deployments/docker/Dockerfile --build-arg VERSION=$CI_COMMIT_SHORT_SHA -t "$DOCKER_IMAGE" .
    - docker push "$DOCKER_IMAGE"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
