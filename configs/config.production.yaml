# Cấu hình môi trường PRODUCTION.
# TẤT CẢ secret đến từ ENV (thường bơm qua Vault/K8s secret). KHÔNG hardcode.
# pprof + swagger TẮT. Sample tracing thấp để giảm chi phí.
app:
  name: docs-hub-api
  env: production
  enable_dev_token: false # loader sẽ fail nếu vô tình bật

http:
  api_port: 8080
  admin_port: 9090
  max_body_bytes: 57671680
  shutdown_timeout: 30s
  enable_pprof: false
  enable_swagger: false

log:
  level: info
  encoding: json

postgres:
  host: postgres
  port: 5432
  user: app
  password: ""
  database: document_hub
  ssl_mode: require
  max_open_conns: 100
  max_idle_conns: 25
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

redis:
  host: redis
  port: 6379
  password: ""
  db: 0
  pool_size: 50

rabbitmq:
  enabled: true
  host: rabbitmq
  port: 5672
  user: app
  password: ""
  vhost: /
  exchange: document_hub.events

storage:
  driver: minio
  filesystem:
    root: ./var/storage

minio:
  enabled: true
  endpoint: minio:9000
  access_key: app
  secret_key: ""
  bucket: document-hub
  use_ssl: true
  region: us-east-1

project:
  avatar_max_bytes: 5242880 # 5 MiB — TẠM THỜI, chờ team chốt lại
  avatar_presigned_ttl: 15m

jwt:
  algorithm: HS256
  secret: ""
  issuer: docs-hub-api
  access_ttl: 15m
  refresh_ttl: 168h

cors:
  allowed_origins: ["https://docshub.io.vn"]
  allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowed_headers: ["Origin", "Content-Type", "Authorization", "X-Request-ID"]
  allow_credentials: true
  max_age: 600

rate_limit:
  enabled: true
  requests_per_window: 500
  window: 1m

telemetry:
  tracing_enabled: true
  otlp_endpoint: otel-collector:4317
  sample_ratio: 0.1

timeout:
  read_header: 5s
  read: 15s
  write: 60s
  idle: 60s
  handler: 45s
  db: 3s
  redis: 2s
  mq: 3s
  external: 5s
ragflow:
  enabled: false
  base_url: https://ragflow.example.internal
  dataset_prefix: docs_hub_prod
  timeout: 30s
  upload_timeout: 2m
  poll_interval: 3s
  max_poll_duration: 15m
