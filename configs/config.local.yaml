# Cấu hình môi trường LOCAL (máy dev).
# Secret có thể để trần ở local cho tiện; ở dev/staging/production PHẢI đến từ ENV.
app:
  name: docs-hub-api
  env: local
  enable_dev_token: true # chỉ local mới được bật

http:
  api_port: 8080
  admin_port: 9090
  max_body_bytes: 57671680 # 55 MiB, gồm multipart overhead cho giới hạn file 50 MiB
  shutdown_timeout: 15s
  enable_pprof: true
  enable_swagger: true

log:
  level: debug
  encoding: console

postgres:
  host: 127.0.0.1
  port: 5433
  user: app
  password: 123456 # local only
  database: document_hub
  ssl_mode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 10m

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0
  pool_size: 10

rabbitmq:
  enabled: true
  host: 127.0.0.1
  port: 5672
  user: app
  password: app_password
  vhost: /
  exchange: document_hub.events

storage:
  driver: filesystem
  filesystem:
    root: ./var/storage

minio:
  enabled: false
  endpoint: 127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  bucket: document-hub
  use_ssl: false
  region: us-east-1

project:
  avatar_max_bytes: 5242880 # 5 MiB — TẠM THỜI, chờ team chốt lại
  avatar_presigned_ttl: 15m

jwt:
  algorithm: HS256
  secret: local-dev-secret-doi-o-moi-truong-that # local only
  issuer: docs-hub-api
  access_ttl: 15m
  refresh_ttl: 168h

cors:
  allowed_origins: ["http://localhost:3000"]
  allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allowed_headers: ["Origin", "Content-Type", "Authorization", "X-Request-ID"]
  allow_credentials: true
  max_age: 300

rate_limit:
  enabled: true
  requests_per_window: 100
  window: 1m

telemetry:
  tracing_enabled: true
  otlp_endpoint: 127.0.0.1:4317
  sample_ratio: 1.0

timeout:
  read_header: 5s
  read: 15s
  write: 60s
  idle: 60s
  handler: 45s
  db: 3s
  redis: 2s
  mq: 3s
  external: 5s

local_ai:
  base_url: http://127.0.0.1:8081
  embedding_model: ""
  embedding_dimension: 0
  timeout: 30s

ragflow:
  enabled: false # bật bằng APP_RAGFLOW_ENABLED=true trong .env
  base_url: https://ragflow.io.vn
  dataset_prefix: docs_hub_local
  timeout: 30s
  upload_timeout: 2m
  poll_interval: 3s
  max_poll_duration: 15m

ingestion:
  poll_interval: 2s
  chunk_lines: 80
  overlap_lines: 10
  batch_size: 16
