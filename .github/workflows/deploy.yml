# Build image -> đẩy lên GHCR -> deploy lên EC2.
#
# Vì sao tách hai job:
#   - build-push chạy trên runner của GitHub (mạnh, amd64 native).
#   - deploy chạy trên self-hosted runner NGAY TRÊN EC2, nên không phải mở
#     port 22 cho dải IP của GitHub, và EC2 không phải build gì cả.
#
# Cách cài runner: deployments/ec2/setup-runner.sh
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag image muốn deploy (bỏ trống = build từ commit hiện tại)'
        required: false

# Không cho hai lần deploy chồng nhau lên cùng một máy.
concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Chặn deploy code hỏng: lint + unit test phải xanh trước khi build image.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - run: go test -race -short ./...

  build-push:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Xác định tag
        id: meta
        run: echo "tag=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployments/docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    # Runner cài trên chính EC2 (xem deployments/ec2/setup-runner.sh).
    runs-on: [self-hosted, docs-hub-ec2]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # Chỉ đưa secret vào environment sau khi checkout xong, tránh cấp secret
      # không cần thiết cho third-party action. GITHUB_ENV chỉ sống trong job.
      - name: Nạp và kiểm tra deployment secrets
        shell: bash
        env:
          APP_POSTGRES_PASSWORD: ${{ secrets.APP_POSTGRES_PASSWORD }}
          APP_REDIS_PASSWORD: ${{ secrets.APP_REDIS_PASSWORD }}
          APP_RABBITMQ_PASSWORD: ${{ secrets.APP_RABBITMQ_PASSWORD }}
          APP_MINIO_SECRET_KEY: ${{ secrets.APP_MINIO_SECRET_KEY }}
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_RAGFLOW_API_KEY: ${{ secrets.APP_RAGFLOW_API_KEY }}
        run: |
          required=(
            APP_POSTGRES_PASSWORD
            APP_RABBITMQ_PASSWORD
            APP_MINIO_SECRET_KEY
            APP_JWT_SECRET
            APP_RAGFLOW_API_KEY
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Thiếu GitHub Actions Secret: %s\n' "${missing[*]}"
            exit 1
          fi
          exported=("${required[@]}" APP_REDIS_PASSWORD)
          for name in "${exported[@]}"; do
            printf '%s=%s\n' "$name" "${!name:-}" >> "$GITHUB_ENV"
          done

      - name: Đăng nhập GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Kéo image mới
        env:
          API_IMAGE: ${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}
        run: |
          docker compose -f deployments/ec2/docker-compose.yml \
            pull migrate api

      - name: Chạy migration rồi khởi động API
        id: deploy_up
        env:
          API_IMAGE: ${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}
        run: |
          docker compose -f deployments/ec2/docker-compose.yml \
            up -d migrate api

      # Khi migrate hỏng, `compose up -d` chỉ báo "exit 1" mà nuốt mất stderr
      # của container — không có bước này thì không biết hỏng vì lý do gì.
      - name: In log khi deploy lỗi
        if: ${{ failure() && steps.deploy_up.outcome == 'failure' }}
        run: |
          echo "=== log migrate ==="
          docker compose -f deployments/ec2/docker-compose.yml \
            logs --tail 100 migrate
          echo "=== trạng thái schema_migrations ==="
          docker exec document-hub-ec2-postgres-1 \
            psql -U app -d document_hub -c "SELECT * FROM schema_migrations;" || true

      - name: Kiểm tra service đã sẵn sàng
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -m 5 localhost:9090/readyz | grep -q '"status":"ready"'; then
              echo "✅ readyz OK sau ${i} lần thử"
              curl -s localhost:9090/readyz
              exit 0
            fi
            sleep 2
          done
          echo "❌ service không sẵn sàng sau 60s — log 50 dòng cuối:"
          docker compose -f deployments/ec2/docker-compose.yml \
            logs --tail 50 api
          exit 1

      # Tạo tài khoản admin đầu tiên. Bắt buộc vì API tạo user nằm sau lớp xác
      # thực — không thể tạo user đầu tiên qua HTTP. seedAdmin idempotent nên
      # chạy lại mỗi lần deploy là vô hại ("admin đã tồn tại, bỏ qua").
      - name: Tạo tài khoản admin mặc định
        env:
          API_IMAGE: ${{ env.IMAGE }}:${{ needs.build-push.outputs.tag }}
        run: |
          docker compose -f deployments/ec2/docker-compose.yml \
            run --rm --entrypoint /app/seed migrate \
            -config /app/configs/config.ec2.yaml

      - name: Dọn image cũ
        if: always()
        run: docker image prune -f --filter "until=168h"
