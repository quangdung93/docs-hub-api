basePath: /
definitions:
  bootstrap.DevTokenRequest:
    properties:
      email:
        type: string
      roles:
        items:
          type: string
        type: array
    required:
    - email
    type: object
  bootstrap.DevTokenResponse:
    properties:
      access_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  domain.Document:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      document_key:
        type: string
      id:
        type: string
      project_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  domain.Revision:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      document_id:
        type: string
      error_code:
        type: string
      error_detail:
        type: string
      file_name:
        type: string
      id:
        type: string
      media_type:
        type: string
      project_id:
        type: string
      revision_no:
        type: integer
      scope:
        $ref: '#/definitions/domain.Scope'
      sha256:
        type: string
      size_bytes:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  domain.Scope:
    properties:
      change_request_id:
        type: string
      project_version_id:
        type: string
    type: object
  http.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 255
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      roles:
        items:
          type: string
        type: array
    required:
    - email
    - full_name
    - password
    type: object
  http.DeleteUserRequest:
    properties:
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  http.DocumentDetailResponse:
    properties:
      document:
        $ref: '#/definitions/domain.Document'
      revisions:
        items:
          $ref: '#/definitions/domain.Revision'
        type: array
    type: object
  http.PresignRequest:
    properties:
      change_request_id:
        type: string
      description:
        type: string
      document_id:
        type: string
      file_name:
        type: string
      media_type:
        type: string
      project_version_id:
        type: string
      sha256:
        type: string
      size_bytes:
        minimum: 1
        type: integer
      title:
        maxLength: 255
        type: string
    required:
    - file_name
    - media_type
    - sha256
    - size_bytes
    type: object
  http.RetryResponse:
    properties:
      status:
        example: queued
        type: string
    type: object
  http.UpdateRequest:
    properties:
      description:
        type: string
      title:
        maxLength: 255
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - title
    - version
    type: object
  http.UpdateStatusRequest:
    properties:
      status:
        enum:
        - active
        - inactive
        - locked
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - status
    - version
    type: object
  http.UpdateUserRequest:
    properties:
      full_name:
        maxLength: 255
        minLength: 1
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - full_name
    - version
    type: object
  http.UploadResponse:
    properties:
      document:
        $ref: '#/definitions/domain.Document'
      revision:
        $ref: '#/definitions/domain.Revision'
    type: object
  pagination.Meta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      retryable:
        type: boolean
    type: object
  response.Meta:
    properties:
      pagination:
        $ref: '#/definitions/pagination.Meta'
      request_id:
        type: string
      timestamp:
        description: ISO-8601 UTC
        type: string
      trace_id:
        type: string
    type: object
  usecase.PresignResult:
    properties:
      expires_at:
        type: string
      object_key:
        type: string
      upload_id:
        type: string
      upload_url:
        type: string
    type: object
info:
  contact: {}
  description: Boilerplate Go Clean Architecture cho ISC.
  title: docs-hub-api
  version: "1.0"
paths:
  /internal/api/v1/projects/{project_id}/documents:
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - default: 1
        description: Trang
        in: query
        name: page
        type: integer
      - default: 20
        description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      - description: Tìm theo tiêu đề
        in: query
        name: q
        type: string
      - description: Trạng thái revision
        in: query
        name: status
        type: string
      - description: MIME type
        in: query
        name: type
        type: string
      - description: Project version ID
        format: uuid
        in: query
        name: version_id
        type: string
      - description: Change request ID
        format: uuid
        in: query
        name: change_request_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Document'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Danh sách tài liệu trong project
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/{id}:
    delete:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Xóa mềm tài liệu
      tags:
      - documents
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.DocumentDetailResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Chi tiết tài liệu và các revision
      tags:
      - documents
    patch:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Metadata và version hiện tại
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Document'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Cập nhật metadata tài liệu
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/{id}/revisions:
    post:
      consumes:
      - multipart/form-data
      description: Upload multipart trực tiếp vào document có sẵn. Phải truyền đúng
        một version hoặc change request.
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: File tài liệu
        in: formData
        name: file
        required: true
        type: file
      - description: Project version ID
        format: uuid
        in: formData
        name: project_version_id
        type: string
      - description: Change request ID
        format: uuid
        in: formData
        name: change_request_id
        type: string
      - description: Kích thước khai báo
        in: formData
        name: size_bytes
        type: integer
      - description: SHA-256 dạng hex, 64 ký tự
        in: formData
        name: sha256
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.UploadResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Upload revision mới cho document
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/{id}/revisions/{revision_id}/download:
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Revision ID
        format: uuid
        in: path
        name: revision_id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Tải file revision gốc
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/{id}/revisions/{revision_id}/retry:
    post:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Revision ID
        format: uuid
        in: path
        name: revision_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.RetryResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Chạy lại ingestion cho revision thất bại
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/{id}/revisions/{revision_id}/status:
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Revision ID
        format: uuid
        in: path
        name: revision_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Revision'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Xem trạng thái ingestion của revision
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/{id}/revisions/{revision_id}/view:
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Revision ID
        format: uuid
        in: path
        name: revision_id
        required: true
        type: string
      produces:
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Xem file revision inline
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/uploads:
    post:
      consumes:
      - multipart/form-data
      description: Upload multipart trực tiếp. Phải truyền đúng một project_version_id
        hoặc change_request_id.
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: File TXT, MD, CSV, PDF text-layer, DOCX hoặc XLSX
        in: formData
        name: file
        required: true
        type: file
      - description: Tiêu đề document mới
        in: formData
        name: title
        required: true
        type: string
      - description: Mô tả
        in: formData
        name: description
        type: string
      - description: Document ID nếu thêm revision
        format: uuid
        in: formData
        name: document_id
        type: string
      - description: Project version ID
        format: uuid
        in: formData
        name: project_version_id
        type: string
      - description: Change request ID
        format: uuid
        in: formData
        name: change_request_id
        type: string
      - description: Kích thước khai báo để đối chiếu
        in: formData
        name: size_bytes
        type: integer
      - description: SHA-256 dạng hex, 64 ký tự
        in: formData
        name: sha256
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.UploadResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Upload tài liệu mới
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/uploads/{upload_id}/complete:
    post:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Upload session ID
        format: uuid
        in: path
        name: upload_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.UploadResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Hoàn tất presigned upload
      tags:
      - documents
  /internal/api/v1/projects/{project_id}/documents/uploads/presign:
    post:
      consumes:
      - application/json
      description: Chỉ khả dụng khi storage.driver=minio; local filesystem trả HTTP
        400 và dùng multipart upload.
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: project_id
        required: true
        type: string
      - description: Thông tin file và scope
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.PresignRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/usecase.PresignResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Tạo presigned upload
      tags:
      - documents
  /internal/api/v1/users:
    get:
      parameters:
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      - description: Từ khóa tìm email/tên
        in: query
        name: keyword
        type: string
      - description: Lọc trạng thái
        in: query
        name: status
        type: string
      - description: Cột sắp xếp
        in: query
        name: sort_by
        type: string
      - description: asc|desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Danh sách người dùng (phân trang)
      tags:
      - users
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin người dùng
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Tạo người dùng mới
      tags:
      - users
  /internal/api/v1/users/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Version
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.DeleteUserRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Xóa mềm người dùng
      tags:
      - users
    get:
      parameters:
      - description: User ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Lấy chi tiết người dùng
      tags:
      - users
    put:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin cập nhật
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Cập nhật hồ sơ người dùng
      tags:
      - users
  /internal/api/v1/users/{id}/status:
    patch:
      consumes:
      - application/json
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Trạng thái mới
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Đổi trạng thái người dùng
      tags:
      - users
  /internal/api/v1/users/check-email:
    get:
      parameters:
      - description: Email cần kiểm tra
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
