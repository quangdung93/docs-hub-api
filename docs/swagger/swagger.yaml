basePath: /
definitions:
  bootstrap.DevTokenRequest:
    properties:
      email:
        type: string
      roles:
        items:
          type: string
        type: array
    required:
    - email
    type: object
  bootstrap.DevTokenResponse:
    properties:
      access_token:
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  domain.Document:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      document_key:
        type: string
      id:
        type: string
      project_id:
        type: string
      title:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  domain.Revision:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      document_id:
        type: string
      error_code:
        type: string
      error_detail:
        type: string
      file_name:
        type: string
      id:
        type: string
      media_type:
        type: string
      project_id:
        type: string
      ragflow_last_error:
        type: string
      ragflow_sync_status:
        type: string
      ragflow_synced_at:
        type: string
      revision_no:
        type: integer
      scope:
        $ref: '#/definitions/internal_module_document_domain.Scope'
      sha256:
        type: string
      size_bytes:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  http.AskRequest:
    properties:
      question:
        type: string
      scope:
        $ref: '#/definitions/internal_module_chat_delivery_http.ScopeRequest'
    required:
    - question
    type: object
  http.ChangeMemberRoleRequest:
    properties:
      role:
        enum:
        - editor
        - viewer
        type: string
    required:
    - role
    type: object
  http.CreateProjectRequest:
    properties:
      code:
        maxLength: 64
        minLength: 2
        type: string
      description:
        maxLength: 2000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      settings:
        $ref: '#/definitions/http.ProjectSettingsRequest'
    required:
    - name
    type: object
  http.CreateRequest:
    properties:
      scope:
        $ref: '#/definitions/internal_module_chat_delivery_http.ScopeRequest'
      title:
        type: string
    type: object
  http.CreateUserRequest:
    properties:
      email:
        type: string
      full_name:
        maxLength: 255
        minLength: 1
        type: string
      password:
        maxLength: 72
        minLength: 8
        type: string
      roles:
        items:
          type: string
        type: array
    required:
    - email
    - full_name
    - password
    type: object
  http.CreateVersionRequest:
    properties:
      label:
        maxLength: 100
        type: string
    required:
    - label
    type: object
  http.DeleteProjectRequest:
    properties:
      confirm_name:
        type: string
    required:
    - confirm_name
    type: object
  http.DeleteUserRequest:
    properties:
      version:
        minimum: 1
        type: integer
    required:
    - version
    type: object
  http.DocumentDetailResponse:
    properties:
      document:
        $ref: '#/definitions/domain.Document'
      revisions:
        items:
          $ref: '#/definitions/domain.Revision'
        type: array
    type: object
  http.InviteMemberRequest:
    properties:
      role:
        enum:
        - editor
        - viewer
        type: string
      user_id:
        type: string
    required:
    - role
    - user_id
    type: object
  http.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  http.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  http.PresignRequest:
    properties:
      change_request_id:
        type: string
      description:
        type: string
      document_id:
        type: string
      file_name:
        type: string
      media_type:
        type: string
      project_version_id:
        type: string
      size_bytes:
        minimum: 1
        type: integer
      title:
        maxLength: 255
        type: string
    required:
    - file_name
    - media_type
    - size_bytes
    type: object
  http.ProjectSettingsRequest:
    properties:
      allowed_formats:
        items:
          type: string
        type: array
      chunk_size:
        minimum: 1
        type: integer
      model:
        type: string
      top_k:
        minimum: 1
        type: integer
    required:
    - allowed_formats
    type: object
  http.ProjectVersionResponse:
    properties:
      created_at:
        type: string
      created_by:
        type: string
      id:
        type: string
      label:
        type: string
      project_id:
        type: string
      released_at:
        type: string
      sequence_no:
        type: integer
      status:
        type: string
      updated_at:
        type: string
    type: object
  http.RefreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  http.Request:
    properties:
      keyword:
        type: boolean
      page_size:
        type: integer
      query:
        type: string
      scope:
        $ref: '#/definitions/internal_module_retrieval_delivery_http.ScopeRequest'
      similarity_threshold:
        type: number
      vector_similarity_weight:
        type: number
    required:
    - query
    - scope
    type: object
  http.RequestAvatarUploadRequest:
    properties:
      mime_type:
        type: string
      size_bytes:
        minimum: 1
        type: integer
    required:
    - mime_type
    - size_bytes
    type: object
  http.RetryResponse:
    properties:
      status:
        example: queued
        type: string
    type: object
  http.UpdateProjectRequest:
    properties:
      description:
        maxLength: 2000
        type: string
      name:
        maxLength: 255
        minLength: 1
        type: string
      settings:
        $ref: '#/definitions/http.ProjectSettingsRequest'
    type: object
  http.UpdateRequest:
    properties:
      description:
        type: string
      title:
        maxLength: 255
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - title
    - version
    type: object
  http.UpdateStatusRequest:
    properties:
      status:
        enum:
        - active
        - inactive
        - locked
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - status
    - version
    type: object
  http.UpdateUserRequest:
    properties:
      full_name:
        maxLength: 255
        minLength: 1
        type: string
      version:
        minimum: 1
        type: integer
    required:
    - full_name
    - version
    type: object
  http.UploadResponse:
    properties:
      document:
        $ref: '#/definitions/domain.Document'
      revision:
        $ref: '#/definitions/domain.Revision'
    type: object
  internal_module_chat_delivery_http.ScopeRequest:
    properties:
      change_request_ids:
        items:
          type: string
        type: array
      mode:
        type: string
      version_ids:
        items:
          type: string
        type: array
    required:
    - mode
    type: object
  internal_module_document_domain.Scope:
    properties:
      change_request_id:
        type: string
      project_version_id:
        type: string
    type: object
  internal_module_retrieval_delivery_http.ScopeRequest:
    properties:
      change_request_ids:
        items:
          type: string
        type: array
      mode:
        type: string
      version_ids:
        items:
          type: string
        type: array
    required:
    - mode
    type: object
  pagination.Meta:
    properties:
      has_next:
        type: boolean
      has_prev:
        type: boolean
      limit:
        type: integer
      page:
        type: integer
      total_items:
        type: integer
      total_pages:
        type: integer
    type: object
  response.Envelope:
    properties:
      data: {}
      error:
        $ref: '#/definitions/response.ErrorBody'
      meta:
        $ref: '#/definitions/response.Meta'
      success:
        type: boolean
    type: object
  response.ErrorBody:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
      retryable:
        type: boolean
    type: object
  response.Meta:
    properties:
      pagination:
        $ref: '#/definitions/pagination.Meta'
      request_id:
        type: string
      timestamp:
        description: ISO-8601 UTC
        type: string
      trace_id:
        type: string
    type: object
  usecase.PresignResult:
    properties:
      expires_at:
        type: string
      object_key:
        type: string
      upload_id:
        type: string
      upload_url:
        type: string
    type: object
info:
  contact: {}
  description: Boilerplate Go Clean Architecture cho ISC.
  title: docs-hub-api
  version: "1.0"
paths:
  /internal/api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Thu hồi session ở server và xóa cookie. Không kèm refresh_token
        thì thu hồi mọi phiên của user.
      parameters:
      - description: Refresh token cần thu hồi (bỏ trống = mọi phiên)
        in: body
        name: body
        schema:
          $ref: '#/definitions/http.LogoutRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Đăng xuất
      tags:
      - auth
  /internal/api/v1/auth/me:
    get:
      description: Lấy thông tin user hiện tại qua JWT
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Lấy thông tin cá nhân
      tags:
      - auth
  /internal/api/v1/projects:
    get:
      parameters:
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      - description: Cột sắp xếp
        in: query
        name: sort_by
        type: string
      - description: asc|desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Danh sách dự án của người dùng hiện tại
      tags:
      - projects
    post:
      consumes:
      - application/json
      parameters:
      - description: Thông tin dự án
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Tạo dự án mới
      tags:
      - projects
  /internal/api/v1/projects/{id}:
    delete:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Xác nhận tên dự án
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.DeleteProjectRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
      security:
      - BearerAuth: []
      summary: Xóa dự án (chỉ Owner, yêu cầu xác nhận đúng tên dự án)
      tags:
      - projects
    get:
      description: Lấy thông tin một dự án kèm số lượng tài liệu/thành viên/chunk.
      parameters:
      - description: Project ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Chi tiết một dự án
      tags:
      - projects
    patch:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin cập nhật
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Cập nhật thông tin/cấu hình dự án
      tags:
      - projects
  /internal/api/v1/projects/{id}/avatar/complete:
    post:
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Xác nhận đã upload xong ảnh đại diện dự án
      tags:
      - projects
  /internal/api/v1/projects/{id}/avatar/upload-url:
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin ảnh
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.RequestAvatarUploadRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Xin phép upload ảnh đại diện dự án (trả presigned URL để client tự
        tải lên)
      tags:
      - projects
  /internal/api/v1/projects/{id}/conversations:
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Trang
        in: query
        name: page
        type: integer
      - description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Liệt kê conversation của actor
      tags:
      - conversations
    post:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Tiêu đề và scope tùy chọn
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Tạo conversation trong project
      tags:
      - conversations
  /internal/api/v1/projects/{id}/conversations/{conversation_id}:
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Conversation ID
        format: uuid
        in: path
        name: conversation_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Xem conversation, messages và citations
      tags:
      - conversations
  /internal/api/v1/projects/{id}/conversations/{conversation_id}/messages:
    post:
      consumes:
      - application/json
      description: RAGFlow Chat sinh answer và citations; nếu không truyền scope,
        truy vấn tất cả version và change request của project.
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Conversation ID
        format: uuid
        in: path
        name: conversation_id
        required: true
        type: string
      - description: Câu hỏi và scope tùy chọn
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.AskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Hỏi đáp trên conversation với citation
      tags:
      - conversations
  /internal/api/v1/projects/{id}/documents:
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - default: 1
        description: Trang
        in: query
        name: page
        type: integer
      - default: 20
        description: Số bản ghi/trang
        in: query
        name: limit
        type: integer
      - description: Tìm theo tiêu đề
        in: query
        name: q
        type: string
      - description: Trạng thái revision
        in: query
        name: status
        type: string
      - description: MIME type
        in: query
        name: type
        type: string
      - description: Project version ID
        format: uuid
        in: query
        name: version_id
        type: string
      - description: Change request ID
        format: uuid
        in: query
        name: change_request_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/domain.Document'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Danh sách tài liệu trong project
      tags:
      - documents
  /internal/api/v1/projects/{id}/documents/{document_id}:
    delete:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: document_id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Xóa mềm tài liệu
      tags:
      - documents
    get:
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: document_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.DocumentDetailResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Chi tiết tài liệu và các revision
      tags:
      - documents
    patch:
      consumes:
      - application/json
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: document_id
        required: true
        type: string
      - description: Metadata và version hiện tại
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/http.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/domain.Document'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
      - BearerAuth: []
      summary: Cập nhật metadata tài liệu
      tags:
      - documents
  /internal/api/v1/projects/{id}/documents/{document_id}/revisions:
    post:
      consumes:
      - multipart/form-data
      description: Upload multipart trực tiếp vào document có sẵn. Phải truyền đúng
        một version hoặc change request.
      parameters:
      - description: Project ID
        format: uuid
        in: path
        name: id
        required: true
        type: string
      - description: Document ID
        format: uuid
        in: path
        name: document_id
        required: true
        type: string
      - description: File tài liệu
        in: formData
        name: file
        required: true
        type: file
      - description: Project version ID
        format: uuid
        in: formData
        name: project_version_id
        type: string
      - description: Change request ID
        format: uuid
        in: formData
        name: change_request_id
        type: string
      - description: Kích thước khai báo
        in: formData
        name: size_bytes
        type: integer
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            allOf:
            - $ref: '#/definitions/response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/http.UploadResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/response.Envelope'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/response.Envelope'
      security:
