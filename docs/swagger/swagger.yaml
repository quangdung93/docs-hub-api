securityDefinitions:
  BearerAuth:
    description: |-
      Nhập theo định dạng: Bearer <token>
      (lấy token qua /public/api/v1/auth/login hoặc /public/api/v1/auth/dev-token ở local)
    in: header
    name: Authorization
    type: apiKey
