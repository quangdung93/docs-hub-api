# OpenAPI 3.0 cho resource users (bắt buộc theo templates/07).
# Response tuân theo envelope ISC: { success, data, error, meta }.
openapi: 3.0.3
info:
  title: document-hub-api — users
  version: "1.0"
servers:
  - url: /internal/api/v1
paths:
  /users:
    get:
      summary: Danh sách người dùng (phân trang)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: keyword, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [active, inactive, locked] } }
        - { name: sort_by, in: query, schema: { type: string, enum: [created_at, updated_at, email, full_name, status] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedUsers" }
    post:
      summary: Tạo người dùng mới
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Tạo thành công
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserEnvelope" }
        "200":
          description: Lỗi nghiệp vụ (ví dụ DUPLICATE_EMAIL) — theo chuẩn ISC vẫn HTTP 200
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /users/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Chi tiết người dùng
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } } }
        "404": { description: Không tìm thấy (USR_404) }
    put:
      summary: Cập nhật hồ sơ (optimistic lock)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } } }
    delete:
      summary: Xóa mềm (optimistic lock)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties: { version: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Đã xóa }
  /users/{id}/status:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      summary: Đổi trạng thái người dùng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, version]
              properties:
                status: { type: string, enum: [active, inactive, locked] }
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/UserEnvelope" } } } }
components:
  schemas:
    Meta:
      type: object
      properties:
        request_id: { type: string }
        trace_id: { type: string }
        timestamp: { type: string, format: date-time }
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total_items: { type: integer }
            total_pages: { type: integer }
            has_next: { type: boolean }
            has_prev: { type: boolean }
    Error:
      type: object
      properties:
        code: { type: string, example: DUPLICATE_EMAIL }
        message: { type: string }
        details: { type: object, nullable: true }
        retryable: { type: boolean }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        full_name: { type: string }
        status: { type: string, enum: [active, inactive, locked] }
        roles: { type: array, items: { type: string } }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [email, full_name, password]
      properties:
        email: { type: string, format: email }
        full_name: { type: string, minLength: 1, maxLength: 255 }
        password: { type: string, minLength: 8, maxLength: 72 }
        roles: { type: array, items: { type: string, enum: [admin, user] } }
    UpdateUserRequest:
      type: object
      required: [full_name, version]
      properties:
        full_name: { type: string, minLength: 1, maxLength: 255 }
        version: { type: integer, minimum: 1 }
    UserEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { $ref: "#/components/schemas/User" }
        error: { type: object, nullable: true, example: null }
        meta: { $ref: "#/components/schemas/Meta" }
    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { type: object, nullable: true, example: null }
        error: { $ref: "#/components/schemas/Error" }
        meta: { $ref: "#/components/schemas/Meta" }
    PagedUsers:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: array, items: { $ref: "#/components/schemas/User" } }
        error: { type: object, nullable: true, example: null }
        meta: { $ref: "#/components/schemas/Meta" }
